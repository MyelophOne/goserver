<div id="spa-loader" role="status" aria-label="Loading">
	<svg class="spinner" viewBox="0 0 50 50" aria-hidden="true">
		<circle
			class="path"
			cx="25"
			cy="25"
			r="20"
			fill="none"
			stroke-width="3"
		></circle>
	</svg>
</div>
<style>
	:root {
		--ui-bg: #121212;
		--loader-fill-color: #fff;
	}
	@media (prefers-color-scheme: light) {
		:root {
			--ui-bg: #f7f7f7;
			--loader-fill-color: #0082e6;
		}
	}
	#spa-loader {
		position: fixed;
		inset: 0;
		background: var(--ui-bg);
		display: flex;
		justify-content: center;
		align-items: center;
		z-index: 9999;
		transition: opacity 0.15s ease;
	}
	.spinner {
		width: 35px;
		height: 35px;
		animation: rotate 1.5s linear infinite;
	}
	.path {
		stroke: var(--loader-fill-color);
		stroke-linecap: round;
		animation: dash 1.2s ease-in-out infinite;
	}
	@keyframes rotate {
		100% {
			transform: rotate(360deg);
		}
	}
	@keyframes dash {
		0% {
			stroke-dasharray: 1, 125;
			stroke-dashoffset: 0;
		}
		50% {
			stroke-dasharray: 75, 125;
			stroke-dashoffset: -30;
		}
		100% {
			stroke-dasharray: 75, 125;
			stroke-dashoffset: -105;
		}
	}
</style>
