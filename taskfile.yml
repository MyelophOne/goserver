version: "3"

dotenv:
  - .env

vars:
  GIT_HASH:
    sh: git rev-parse --short HEAD || echo "dev"
  GOSERVER_VERSION:
    sh: go run ./cmd/version || echo dev
  EXT:
    sh: go env GOEXE
  BIN: "./dist/goserver{{.EXT}}"
  CONFIG_WEB_ENABLED:
    sh: go run ./cmd/webmode
  WEB_ENABLED: '{{if .MYELOPHONE_WEB_ENABLED}}{{.MYELOPHONE_WEB_ENABLED}}{{else}}{{.CONFIG_WEB_ENABLED}}{{end}}'

tasks:
  setup:
    desc: Install the required Tailwind and client-entry builders for GOSH
    silent: true
    cmds:
      - go run -tags webcli ./cmd setup
  setup:tailwind:
    silent: true
    cmds:
      - task: setup
  setup:client:
    silent: true
    cmds:
      - task: setup
  web:audit:
    desc: Report unused assets; never deletes source files
    silent: true
    cmds:
      - go run -tags webcli ./cmd audit
      - cmd: echo "Unused assets report is ready."
  web:clean:
    desc: "Optional: remove generated GOSH build output and the audit report"
    silent: true
    cmds:
      - cmd: echo "Start cleaning build output and the audit report..."
      - go run -tags webcli ./cmd clean
  web:generate:
    desc: Generate @server handler bindings from GOSH directives
    silent: true
    deps: [setup]
    cmds:
      - go run -tags webcli ./cmd generate
  web:asset-report:
    silent: true
    deps: [setup]
    env:
      APP_ENV: prod
      MYELOPHONE_WEB_ASSET_REPORT: tmp/web-assets.json
    cmds:
      - go run -tags webcli ./cmd generate
  web:build:
    desc: Build a standalone production web distribution in dist/
    silent: true
    deps: [setup]
    env:
      APP_ENV: prod
      GIT_COMMIT_HASH: "{{.GIT_HASH}}"
      GOSERVER_VERSION: "{{.GOSERVER_VERSION}}"
    cmds:
      - go run -tags webcli ./cmd generate
      - go run -tags "webcli webbuild" ./cmd build
  web:build:profile:
    desc: Build a production web distribution with Server-Timing profiling enabled
    silent: true
    deps: [setup]
    env:
      APP_ENV: prod
      GIT_COMMIT_HASH: "{{.GIT_HASH}}"
      GOSERVER_VERSION: "{{.GOSERVER_VERSION}}"
      MYELOPHONE_WEB_RENDER_SERVER_TIMING: "true"
    cmds:
      - go run -tags webcli ./cmd generate
      - go run -tags "webcli webbuild" ./cmd build
  run:
    env:
      APP_ENV: dev
    silent: true
    cmds:
      - cmd: echo "Start running app..."
      - task: '{{if eq .WEB_ENABLED "true"}}web:generate{{end}}'
      - go run ./cmd
  dev:
    env:
      APP_ENV: dev
    silent: true
    cmds:
      - cmd: echo "Start dev running app..."
      - task: '{{if eq .WEB_ENABLED "true"}}web:generate{{end}}'
      - air -c .air.toml
  preview:
    env:
      APP_ENV: prod
    silent: true
    cmds:
      - cmd: echo "Start previewing app..."
      - task: '{{if eq .WEB_ENABLED "true"}}web:generate{{end}}'
      - go run ./cmd
  profile:
    silent: true
    env:
      MYELOPHONE_WEB_RENDER_SERVER_TIMING: "true"
    cmds:
      - cmd: echo "Start building app with profiling..."
      - task: '{{if eq .WEB_ENABLED "true"}}web:build:profile{{end}}'
      - task: '{{if ne .WEB_ENABLED "true"}}build:server{{end}}'
      - cmd: echo "Done! Use \"task server\" command to run it."
  build:
    silent: true
    cmds:
      - cmd: echo "Start building app..."
      - task: '{{if eq .WEB_ENABLED "true"}}web:build{{end}}'
      - task: '{{if ne .WEB_ENABLED "true"}}build:server{{end}}'
      - cmd: echo "Done! Use \"task server\" command to run it."
  build:server:
    internal: true
    silent: true
    env:
      APP_ENV: prod
      GIT_COMMIT_HASH: "{{.GIT_HASH}}"
    cmds:
      - CGO_ENABLED=0 GOFLAGS="-trimpath" go build -tags myelophone_prod -pgo=auto -ldflags="-s -w -X github.com/myelophone/goserver.AppEnv=prod -X github.com/myelophone/goserver.AppVersion=${GIT_COMMIT_HASH}" -o {{.BIN}} ./cmd
  server:
    silent: true
    dir: dist
    cmds:
      - cmd: echo "Starting app..."
      - "./goserver{{.EXT}} {{.CLI_ARGS}}"
  lint:
    cmds:
      - golangci-lint run
  format:
    cmds:
      - go fmt ./...
  vet:
    cmds:
      - go vet ./...
  vulncheck:
    cmds:
      - govulncheck ./...
  test:
    cmds:
      - go test ./...
  clean:
    cmds:
      - go clean -cache
  cover:
    desc: Run tests with coverage
    cmds:
      - go test -run . -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - |
        if command -v xdg-open >/dev/null 2>&1; then
          xdg-open coverage.html
        elif command -v open >/dev/null 2>&1; then
          open coverage.html
        else
          echo "Open coverage.html manually"
        fi
  check-updates:
    cmds:
      - go list -u -m all
  update:
    cmds:
      - go get -u ./...
      - go mod tidy
  ba:
    cmds:
      - betteralign ./... || true
  bafix:
    cmds:
      - betteralign -apply ./... || true
  critic:
    cmds:
      - go-critic check ./...
  osv:
    cmds:
      - osv-scanner scan source -r .
  optimize:
    cmds:
      - task: format
      - task: lint
      - task: vet
      - task: vulncheck
      - task: osv
      #- task: critic # temporarily commented out as it does not support go 1.27 yet
      - task: bafix
  loadtest:
    cmds:
      - bombardier -c 10 -d 10s http://localhost:8080
      - bombardier -c 50 -d 15s -l http://localhost:8080
      - bombardier -c 100 -d 15s -l http://localhost:8080
      - bombardier -c 250 -d 15s -l http://localhost:8080
      - bombardier -c 500 -d 15s -l http://localhost:8080
      - bombardier -c 1000 -d 15s -l http://localhost:8080
      - bombardier -c 2000 -d 15s -l http://localhost:8080
      - bombardier -c 250 -d 3m -l http://localhost:8080
  analyze-web:
    deps: [build]
    cmds:
      - gsa --web {{.BIN}}
  analyze-tui:
    deps: [build]
    cmds:
      - gsa --tui {{.BIN}}
  analyze:
    deps: [build]
    cmds:
      - gsa {{.BIN}}
  tag:patch:
    desc: Increment patch version and create tag
    cmds:
      - |
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        VERSION=${LAST_TAG#v}
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
        PATCH=$((PATCH+1))
        NEW_TAG="v$MAJOR.$MINOR.$PATCH"
        echo "New tag: $NEW_TAG"
        git tag $NEW_TAG
        git push origin $NEW_TAG
  tag:minor:
    desc: Increment minor version and create tag
    cmds:
      - |
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        VERSION=${LAST_TAG#v}
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
        MINOR=$((MINOR+1))
        PATCH=0
        NEW_TAG="v$MAJOR.$MINOR.$PATCH"
        echo "New tag: $NEW_TAG"
        git tag $NEW_TAG
        git push origin $NEW_TAG
  tag:major:
    desc: Increment major version and create tag
    cmds:
      - |
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        VERSION=${LAST_TAG#v}
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
        MAJOR=$((MAJOR+1))
        MINOR=0
        PATCH=0
        NEW_TAG="v$MAJOR.$MINOR.$PATCH"
        echo "New tag: $NEW_TAG"
        git tag $NEW_TAG
        git push origin $NEW_TAG
  pprof:
    desc: "Pprof analyze. Example: task pprof -- ~/Downloads/heap.pb.gz"
    cmds:
      - go tool pprof -http=:8080 {{.CLI_ARGS}}
    preconditions:
      - sh: 'test -n "{{.CLI_ARGS}}"'
